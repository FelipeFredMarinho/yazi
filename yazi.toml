[mgr]
show_hidden   = true
scrolloff     = 12
linemode      = "size"

[opener]
play = [
    { run = 'mpv "$@"', orphan = true, for = "unix" },
    { run = '"C:\Program Files\mpv.exe" %*', orphan = true, for = "windows" }
]
edit = [
    { run = '${EDITOR:-nvim} "$@"', desc = "$EDITOR", block = true, for = "unix" },
    { run = "%EDITOR% %*",  block = true, for = "windows" },
]
view = [
  { run = 'imv "$@"', orphan = true, for = "unix" },
]
[open]
prepend_rules = [
	{ url = "*.toml", use = "edit" },
	{ url = "*.md", use = "edit" },
	{ url = "*.heic", use = "view" },
	{ url = "*.HEIC", use = "view" },
	{ url = "*.jpg", use = "view" },
	{ url = "*.jpeg", use = "view" },
]

